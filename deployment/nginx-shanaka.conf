server {
    listen 80;
    server_name shanakakulathunga.com www.shanakakulathunga.com;
    root /var/www/shanaka;

    # PHP admin stylesheet; the remaining public site is served by Node.
    location = /admin/admin.css { alias /var/www/shanaka/admin/admin.css; }

    location ~ ^/(api|admin)/.+\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
