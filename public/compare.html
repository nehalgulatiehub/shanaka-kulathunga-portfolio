<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Homepage comparison</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#151515;color:#fff;font:14px Arial,sans-serif}.bar{height:52px;display:flex;align-items:center;justify-content:center;gap:14px;position:sticky;top:0;background:#151515;z-index:2}.bar b{color:#e8d19b}.compare{display:grid;grid-template-columns:1fr 1fr;gap:2px;height:calc(100vh - 52px);background:#555}.pane{display:grid;grid-template-rows:35px 1fr;min-width:0}.pane span{padding:10px 14px;background:#222;font-weight:700}.pane:first-child span{color:#e8d19b}.pane iframe,.reference{border:0;width:100%;height:100%;background:#fff}.reference{overflow:auto}.reference img{display:block;width:100%;height:auto}@media(max-width:780px){.compare{grid-template-columns:1fr;height:auto}.pane iframe,.reference{height:85vh}}
  </style>
</head>
<body>
  <div class="bar"><b>Left:</b> custom replica <span>•</span><b>Right:</b> live WordPress page</div>
  <main class="compare">
    <section class="pane"><span>Custom Node.js replica</span><iframe src="/" title="Custom replica"></iframe></section>
    <section class="pane"><span>Live WordPress site — captured full-page reference</span><div class="reference"><img src="/reference/live-home.png" alt="Live Shanaka Kulathunga homepage reference"></div></section>
  </main>
</body>
</html>
